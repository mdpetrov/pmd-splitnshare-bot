name: Main tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql+asyncpg://splitnshare:splitnshare@localhost:5432/splitnshare

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: splitnshare
          POSTGRES_USER: splitnshare
          POSTGRES_PASSWORD: splitnshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitnshare -d splitnshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

      - name: Run pytest
        run: python -m pytest -v

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Verify current migration
        run: python -m alembic current

      - name: Check migration consistency
        run: python -m alembic check

      - name: Run PostgreSQL smoke test
        run: python -m splitnshare.infrastructure.database_health
