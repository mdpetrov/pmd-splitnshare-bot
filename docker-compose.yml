services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: splitnshare
      POSTGRES_USER: splitnshare
      POSTGRES_PASSWORD: splitnshare
    ports:
      - "5432:5432"
    volumes:
      - splitnshare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitnshare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  splitnshare-postgres:

