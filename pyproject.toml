[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "splitnshare-bot"
version = "0.3.0"
description = "An asynchronous Splitwise-like Telegram bot with explicit guest transfers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.28,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<2.2",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
splitnshare = "splitnshare.__main__:main"
splitnshare-db-smoke = "splitnshare.infrastructure.database_health:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splitnshare"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
exclude = [".conda"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/splitnshare"]
